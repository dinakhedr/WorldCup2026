<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Matches · World Cup 2026</title>
  <!-- PWA & Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="images/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
  <link rel="shortcut icon" href="images/icon-192.png">
  <meta name="apple-mobile-web-app-title" content="WC2026">
  <meta name="theme-color" content="#0D1B3E">
  <!-- Fonts & Styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js"></script>
  <script src="utils.js"></script>
</head>
<body>

<div class="screen active" id="loadingScreen">
  <div class="screen-card" id="loadingBox">
    <span class="screen-trophy">📋</span>
    <div class="screen-title">Matches</div>
    <div class="screen-sub" id="loadingMsg">Loading match data…</div>
    <div class="spinner"></div>
  </div>
</div>

<div id="mainApp" style="display:none;">

  <div class="page-header">
    <div class="header-row">
      <div class="header-left">
        <a class="back-btn" href="Home.html">‹</a>
        <div class="page-title">📋 All Matches</div>
      </div>
      <div class="header-actions">
        <button class="hdr-btn" onclick="syncMatches()" title="Refresh">🔄</button>
      </div>
    </div>

    <div class="mini-stats">
      <div class="mini-stat"><div class="mini-stat-val" id="msPlayed">—</div><div class="mini-stat-lbl">Played</div></div>
      <div class="mini-stat"><div class="mini-stat-val" id="msGoals">—</div><div class="mini-stat-lbl">Goals</div></div>
      <div class="mini-stat"><div class="mini-stat-val" id="msLeft">—</div><div class="mini-stat-lbl">Upcoming</div></div>
      <div class="mini-stat"><div class="mini-stat-val" id="msTotal">104</div><div class="mini-stat-lbl">Total</div></div>
    </div>

    <div class="filter-section">
      <div class="filter-block">
        <div class="filter-label">Status</div>
        <div class="status-seg" id="statusSeg">
          <button class="seg-btn on" data-status="upcoming" onclick="setStatus('upcoming')">Upcoming</button>
          <button class="seg-btn" data-status="played" onclick="setStatus('played')">Played</button>
          <button class="seg-btn" data-status="all" onclick="setStatus('all')">All</button>
        </div>
      </div>

      <div class="filter-block">
        <div class="filter-label">Team</div>
        <select id="teamDropdown" class="team-dropdown" onchange="setTeam(this.value)">
          <option value="">All Teams</option>
        </select>
      </div>

      <div class="filter-block">
        <div class="filter-label">Group Stage</div>
        <div class="filter-chips" id="groupChips">
          <button class="filter-chip on" data-group="all" onclick="setGroup('all')">All</button>
          <button class="filter-chip" data-group="A" onclick="setGroup('A')">A</button>
          <button class="filter-chip" data-group="B" onclick="setGroup('B')">B</button>
          <button class="filter-chip" data-group="C" onclick="setGroup('C')">C</button>
          <button class="filter-chip" data-group="D" onclick="setGroup('D')">D</button>
          <button class="filter-chip" data-group="E" onclick="setGroup('E')">E</button>
          <button class="filter-chip" data-group="F" onclick="setGroup('F')">F</button>
          <button class="filter-chip" data-group="G" onclick="setGroup('G')">G</button>
          <button class="filter-chip" data-group="H" onclick="setGroup('H')">H</button>
          <button class="filter-chip" data-group="I" onclick="setGroup('I')">I</button>
          <button class="filter-chip" data-group="J" onclick="setGroup('J')">J</button>
          <button class="filter-chip" data-group="K" onclick="setGroup('K')">K</button>
          <button class="filter-chip" data-group="L" onclick="setGroup('L')">L</button>
        </div>
      </div>

      <div class="filter-block">
        <div class="filter-label">Knockout</div>
        <div class="filter-chips" id="koChips">
          <button class="filter-chip on" data-ko="all" onclick="setKO('all')">All</button>
          <button class="filter-chip" data-ko="R32" onclick="setKO('R32')">R32</button>
          <button class="filter-chip" data-ko="R16" onclick="setKO('R16')">R16</button>
          <button class="filter-chip" data-ko="QF" onclick="setKO('QF')">QF</button>
          <button class="filter-chip" data-ko="SF" onclick="setKO('SF')">SF</button>
          <button class="filter-chip" data-ko="Final" onclick="setKO('Final')">Final</button>
        </div>
      </div>
    </div>
  </div>

  <div class="content" id="matchList">
    <div class="loading-state"><div class="spinner"></div></div>
  </div>

  <!-- Bottom nav spacer (prevents content from hiding behind fixed nav) -->
  <div class="bottom-nav-spacer"></div>

</div>

<div id="scoreModalMount"></div>
<div id="bottomNavMount"></div>
<div class="toast" id="toast"></div>

<script>
window._onScoreSaved = async function() { await syncMatches(true); };

// ── Filter state (default: Upcoming) ──
const filterState = {
  status: 'upcoming',  // 'upcoming' | 'played' | 'all'
  team:   '',          // '' = all teams
  group:  'all',       // 'all' | 'A'..'L'
  ko:     'all'        // 'all' | 'R32' | 'R16' | 'QF' | 'SF' | 'Final'
};

// Maps short KO chip labels → actual m.group values from the sheet
const KO_MAP = {
  'R32':   ['Round of 32'],
  'R16':   ['Round of 16'],
  'QF':    ['Quarter-Final'],
  'SF':    ['Semi-Final'],
  'Final': ['Final', 'Bronze Medal']   // Final + 3rd Place shown together
};

// ── Setters ──
function setStatus(v) {
  filterState.status = v;
  updateChipUI('statusSeg', 'data-status', v);
  applyFilters();
}
function setTeam(v) {
  filterState.team = (v || '').trim();
  applyFilters();
}
function setGroup(v) {
  filterState.group = v;
  // Mutual exclusion: picking a specific group resets KO to 'all'
  if (v !== 'all' && filterState.ko !== 'all') {
    filterState.ko = 'all';
    updateChipUI('koChips', 'data-ko', 'all');
  }
  updateChipUI('groupChips', 'data-group', v);
  applyFilters();
}
function setKO(v) {
  filterState.ko = v;
  // Mutual exclusion: picking a specific KO stage resets Group to 'all'
  if (v !== 'all' && filterState.group !== 'all') {
    filterState.group = 'all';
    updateChipUI('groupChips', 'data-group', 'all');
  }
  updateChipUI('koChips', 'data-ko', v);
  applyFilters();
}
function updateChipUI(containerId, attr, value) {
  const container = document.getElementById(containerId);
  if (!container) return;
  container.querySelectorAll('[' + attr + ']').forEach(el => {
    if (el.getAttribute(attr) === value) el.classList.add('on');
    else el.classList.remove('on');
  });
}

function applyFilters() {
  let list = window._allMatches || [];

  // Status
  if (filterState.status === 'upcoming')    list = list.filter(m => m.status !== 'Played');
  else if (filterState.status === 'played') list = list.filter(m => m.status === 'Played');

  // Team
  if (filterState.team) {
    list = list.filter(m => m.home === filterState.team || m.away === filterState.team);
  }

  // Group / Knockout (mutually exclusive)
  if (filterState.group !== 'all') {
    list = list.filter(m => !m.isKO && m.group === filterState.group);
  } else if (filterState.ko !== 'all') {
    const stages = KO_MAP[filterState.ko] || [];
    list = list.filter(m => m.isKO && stages.includes(m.group));
  }

  renderList(list);
}

function renderList(matches) {
  const el = document.getElementById('matchList');
  if (!matches.length) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-txt">No matches found</div></div>`;
    return;
  }
  const byDate = {};
  matches.forEach(m => { (byDate[m.date || 'TBD'] = byDate[m.date || 'TBD'] || []).push(m); });
  let html = '';
  for (const [date, list] of Object.entries(byDate)) {
    html += `<div class="date-label">${formatDateLabel(date)}</div>`;
    list.forEach(m => { html += matchCardHTML(m); });
  }
  el.innerHTML = html;
}

async function syncMatches(silent = false) {
  if (!silent) showToast('Refreshing…');
  try {
    window._allMatches = await loadAllMatches(true); // force bypass cache
    updateMiniStats();
    applyFilters();
    if (!silent) showToast('✅ Updated');
  } catch(e) {
    showToast('Sync failed', 'error');
  }
}

function updateMiniStats() {
  const all = window._allMatches || [];
  const played   = all.filter(m => m.status === 'Played').length;
  const goals    = all.filter(m => m.status === 'Played').reduce((s,m) => s + (parseInt(m.homeScore)||0) + (parseInt(m.awayScore)||0), 0);
  const upcoming = all.filter(m => m.status !== 'Played').length;
  document.getElementById('msPlayed').textContent = played;
  document.getElementById('msGoals').textContent  = goals;
  document.getElementById('msLeft').textContent   = upcoming;
  document.getElementById('msTotal').textContent  = all.length;

  // Populate team dropdown
  const teams = [...new Set(all.flatMap(m => [m.home, m.away]).filter(Boolean))].sort();
  const sel = document.getElementById('teamDropdown');
  const current = sel.value;
  sel.innerHTML = '<option value="">All Teams</option>' +
    teams.map(t => `<option value="${escHtml(t)}"${t === current ? ' selected' : ''}>${escHtml(t)}</option>`).join('');
}

window.onload = async function() {
  document.getElementById('scoreModalMount').innerHTML = renderScoreModalHTML();
  await initPageAuth({
    activePage: 'matches',
    onReady: async () => {
      window._allMatches = await loadAllMatches();
      updateMiniStats();
      applyFilters();   // defaults to Upcoming
      showMainApp();
    }
  });
};
</script>
</body>
</html>
