<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Matches · World Cup 2026</title>
  <!-- PWA & Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="images/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
  <link rel="shortcut icon" href="images/icon-192.png">
  <meta name="apple-mobile-web-app-title" content="WC2026">
  <meta name="theme-color" content="#0D1B3E">
  <!-- Fonts & Styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js"></script>
  <script src="utils.js"></script>
</head>
<body>

<div class="screen active" id="loadingScreen">
  <div class="screen-card" id="loadingBox">
    <span class="screen-trophy">📋</span>
    <div class="screen-title">Matches</div>
    <div class="screen-sub" id="loadingMsg">Loading match data…</div>
    <div class="spinner"></div>
  </div>
</div>

<div id="mainApp" style="display:none;">

  <div class="page-header">
    <div class="header-row">
      <div class="header-left">
        <a class="back-btn" href="Home.html">‹</a>
        <div class="page-title">📋 All Matches</div>
      </div>
      <div class="header-actions">
        <button class="hdr-btn" onclick="syncMatches()" title="Refresh">🔄</button>
      </div>
    </div>

    <div class="mini-stats">
      <div class="mini-stat"><div class="mini-stat-val" id="msPlayed">—</div><div class="mini-stat-lbl">Played</div></div>
      <div class="mini-stat"><div class="mini-stat-val" id="msGoals">—</div><div class="mini-stat-lbl">Goals</div></div>
      <div class="mini-stat"><div class="mini-stat-val" id="msLeft">—</div><div class="mini-stat-lbl">Upcoming</div></div>
      <div class="mini-stat"><div class="mini-stat-val" id="msTotal">104</div><div class="mini-stat-lbl">Total</div></div>
    </div>

    <div class="filter-section">
      <div class="search-wrap">
        <div class="search-inner">
          <span class="search-icon">🔍</span>
          <input class="search-input" id="searchInput" placeholder="Search team, venue, city…" oninput="applyFilters()">
        </div>
      </div>
      <div class="chips-scroll" id="chipsContainer"></div>
    </div>
  </div>

  <div class="content" id="matchList">
    <div class="loading-state"><div class="spinner"></div></div>
  </div>

  <!-- Bottom nav spacer (prevents content from hiding behind fixed nav) -->
  <div class="bottom-nav-spacer"></div>

</div>

<div id="scoreModalMount"></div>
<div id="bottomNavMount"></div>
<div class="toast" id="toast"></div>

<script>
let activeFilter = 'all';
window._onScoreSaved = async function() { await syncMatches(true); };

function buildChips() {
  const container = document.getElementById('chipsContainer');
  if (!container) return;
  const groups = ['A','B','C','D','E','F','G','H','I','J','K','L'];
  let chipsHTML = `
    <div class="chip active" data-filter="all">All</div>
    <div class="chip" data-filter="upcoming">Upcoming</div>
    <div class="chip" data-filter="played">Played</div>
  `;
  for (let g of groups) {
    chipsHTML += `<div class="chip chip-group-${g.toLowerCase()}" data-filter="${g}">Group ${g}</div>`;
  }
  chipsHTML += `<div class="chip chip-knockout" data-filter="knockout">⚡ Knockout</div>`;
  container.innerHTML = chipsHTML;
  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const filter = chip.getAttribute('data-filter');
      setFilter(filter, chip);
    });
  });
}

function setFilter(f, el) {
  activeFilter = f;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  applyFilters();
}

function applyFilters() {
  const q = (document.getElementById('searchInput').value || '').toLowerCase().trim();
  let list = window._allMatches || [];
  if (activeFilter === 'upcoming') list = list.filter(m => m.status !== 'Played');
  else if (activeFilter === 'played') list = list.filter(m => m.status === 'Played');
  else if (activeFilter === 'knockout') list = list.filter(m => m.isKO);
  else if (activeFilter !== 'all') list = list.filter(m => m.group === activeFilter);
  if (q) {
    list = list.filter(m =>
      m.home.toLowerCase().includes(q) ||
      m.away.toLowerCase().includes(q) ||
      m.venue.toLowerCase().includes(q) ||
      m.city.toLowerCase().includes(q) ||
      m.country.toLowerCase().includes(q) ||
      (m.group || '').toLowerCase().includes(q)
    );
  }
  renderList(list);
}

function renderList(matches) {
  const el = document.getElementById('matchList');
  if (!matches.length) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-txt">No matches found</div></div>`;
    return;
  }
  const byDate = {};
  matches.forEach(m => { (byDate[m.date || 'TBD'] = byDate[m.date || 'TBD'] || []).push(m); });
  let html = '';
  for (const [date, list] of Object.entries(byDate)) {
    html += `<div class="date-label">${formatDateLabel(date)}</div>`;
    list.forEach(m => { html += matchCardHTML(m); });
  }
  el.innerHTML = html;
}

async function syncMatches(silent = false) {
  if (!silent) showToast('Refreshing…');
  try {
    window._allMatches = await loadAllMatches();
    updateMiniStats();
    applyFilters();
    if (!silent) showToast('✅ Updated');
  } catch(e) {
    showToast('Sync failed', 'error');
  }
}

function updateMiniStats() {
  const all = window._allMatches || [];
  const played = all.filter(m => m.status === 'Played').length;
  const goals = all.filter(m => m.status === 'Played').reduce((s,m) => s + (parseInt(m.homeScore)||0) + (parseInt(m.awayScore)||0), 0);
  const upcoming = all.filter(m => m.status !== 'Played').length;
  document.getElementById('msPlayed').textContent = played;
  document.getElementById('msGoals').textContent = goals;
  document.getElementById('msLeft').textContent = upcoming;
  document.getElementById('msTotal').textContent = all.length;
}

window.onload = async function() {
  document.getElementById('scoreModalMount').innerHTML = renderScoreModalHTML();
  await initPageAuth({
    activePage: 'matches',
    onReady: async () => {
      window._allMatches = await loadAllMatches();
      updateMiniStats();
      buildChips();
      applyFilters();
      showMainApp();
    }
  });
};
</script>
</body>
</html>
