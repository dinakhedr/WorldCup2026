<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Standings · World Cup 2026</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="images/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
  <link rel="shortcut icon" href="images/icon-192.png">
  <meta name="apple-mobile-web-app-title" content="WC2026">
  <meta name="theme-color" content="#0D1B3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js"></script>
  <script src="utils.js"></script>
  <style>
    /* ── Section headers ── */
    .st-section {
      padding: 20px 14px 8px;
    }
    .st-section-title {
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--text-3);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 2px;
    }
    .st-section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .st-section-sub {
      font-size: 11px;
      color: var(--text-3);
      margin-bottom: 10px;
      padding-left: 2px;
    }

    /* ── Qualified grid (2 columns of cards) ── */
    .qualified-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 0 14px;
    }
    .qual-group-card {
      background: var(--surface);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .qual-group-label {
      font-size: 9px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 5px 10px;
      border-bottom: 1px solid var(--border);
    }
    .qual-team-row {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 10px;
      border-bottom: 1px solid var(--border);
    }
    .qual-team-row:last-child { border-bottom: none; }
    .qual-pos {
      font-size: 9px;
      font-weight: 900;
      color: var(--text-3);
      width: 12px;
      flex-shrink: 0;
    }
    .qual-team-name {
      font-size: 11px;
      font-weight: 700;
      color: var(--text);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .qual-pts {
      font-size: 11px;
      font-weight: 900;
      color: var(--green-mid);
      flex-shrink: 0;
    }
    .qual-pts-label {
      font-size: 8px;
      color: var(--text-3);
      flex-shrink: 0;
    }
    /* Green left border for qualified positions */
    .qual-team-row.q1 { border-left: 3px solid #10b981; }
    .qual-team-row.q2 { border-left: 3px solid #34d399; }
    /* Pending — group not finished */
    .qual-team-name.pending { color: var(--text-3); }

    /* ── Best 3rd Place table ── */
    .bubble-wrap {
      margin: 0 14px;
      background: var(--surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .bubble-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .bubble-table th {
      padding: 8px 6px;
      text-align: center;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-3);
      border-bottom: 1px solid var(--border);
    }
    .bubble-table th:first-child { text-align: left; padding-left: 12px; }
    .bubble-table td {
      padding: 9px 6px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      color: var(--text-2);
      font-size: 11px;
    }
    .bubble-table td:first-child {
      text-align: left;
      padding-left: 12px;
    }
    .bubble-table tr:last-child td { border-bottom: none; }

    /* The cut line row */
    .bubble-cutline td {
      border-bottom: 2px dashed var(--warning) !important;
      position: relative;
    }
    .cutline-label {
      position: absolute;
      right: 6px;
      bottom: -8px;
      font-size: 8px;
      font-weight: 900;
      color: var(--warning);
      background: var(--surface);
      padding: 0 3px;
      z-index: 1;
      white-space: nowrap;
    }

    /* Through = green tint row */
    .bubble-table tr.through td { background: rgba(16,185,129,0.05); }
    .bubble-table tr.through td:first-child { border-left: 3px solid #10b981; }
    /* On the bubble = amber tint */
    .bubble-table tr.bubble td { background: rgba(245,158,11,0.05); }
    .bubble-table tr.bubble td:first-child { border-left: 3px solid var(--warning); }
    /* Eliminated = normal */

    .pts-bold { font-weight: 900; color: var(--text); }
    .pts-through { font-weight: 900; color: #10b981; }
    .pts-bubble  { font-weight: 900; color: var(--warning); }

    .grp-badge {
      display: inline-block;
      font-size: 8px;
      font-weight: 900;
      padding: 1px 5px;
      border-radius: 4px;
      margin-right: 4px;
      vertical-align: middle;
      flex-shrink: 0;
    }

    /* ── Bubble legend ── */
    .bubble-legend {
      display: flex;
      gap: 12px;
      padding: 8px 14px 0;
      flex-wrap: wrap;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      color: var(--text-3);
    }
    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    /* ── Progress bar for groups complete ── */
    .groups-progress {
      margin: 0 14px 4px;
      background: rgba(255,255,255,0.08);
      border-radius: 4px;
      height: 4px;
      overflow: hidden;
    }
    .groups-progress-fill {
      height: 100%;
      background: var(--gold);
      border-radius: 4px;
      transition: width 0.4s ease;
    }
    .groups-progress-label {
      font-size: 10px;
      color: var(--text-3);
      padding: 3px 14px 8px;
    }

    /* ── Empty state for no matches played ── */
    .no-data-note {
      text-align: center;
      padding: 24px 16px;
      font-size: 12px;
      color: var(--text-3);
      line-height: 1.6;
    }
  </style>
</head>
<body>

<div class="screen active" id="loadingScreen">
  <div class="screen-card" id="loadingBox">
    <span class="screen-trophy">📊</span>
    <div class="screen-title">Standings</div>
    <div class="screen-sub" id="loadingMsg">Calculating standings…</div>
    <div class="spinner"></div>
  </div>
</div>

<div id="mainApp" style="display:none;">
  <div class="page-header">
    <div class="header-row">
      <div class="header-left">
        <a class="back-btn" href="Home.html">‹</a>
        <div class="page-title">📊 Standings</div>
      </div>
      <div class="header-actions">
        <button class="hdr-btn" onclick="syncStandings()" title="Refresh">🔄</button>
      </div>
    </div>
    <div class="mini-stats">
      <div class="mini-stat"><div class="mini-stat-val" id="statThrough">—</div><div class="mini-stat-lbl">Through</div></div>
      <div class="mini-stat"><div class="mini-stat-val" id="statBubble">—</div><div class="mini-stat-lbl">On bubble</div></div>
      <div class="mini-stat"><div class="mini-stat-val" id="statGroupsDone">—</div><div class="mini-stat-lbl">Groups done</div></div>
    </div>
  </div>

  <div class="content" id="standingsContent">
    <div class="loading-state"><div class="spinner"></div></div>
  </div>

  <div class="bottom-nav-spacer"></div>
</div>

<div id="scoreModalMount"></div>
<div id="bottomNavMount"></div>
<div class="toast" id="toast"></div>

<script>
let allMatches = [];
window._onScoreSaved = async function() { await loadStandings(); };

const ALL_GROUPS = ['A','B','C','D','E','F','G','H','I','J','K','L'];
const MATCHES_PER_GROUP = 6; // 4 teams × 3 matches each / 2 = 6

// ── Compute standings for one group ──────────────────────────
function computeGroup(groupId, matches) {
  const teams = GROUPS_TEAMS[groupId] || [];
  const stats = {};
teams.forEach(t => {
    stats[t] = { played:0, wins:0, draws:0, losses:0, gf:0, ga:0, gd:0, points:0, fairPlay:0 };
  });
  matches.forEach(m => {
    if (m.status !== 'Played') return;
    const h = m.home, a = m.away;
    if (!stats[h] || !stats[a]) return;
    const hg = parseInt(m.homeScore)||0, ag = parseInt(m.awayScore)||0;
    stats[h].played++; stats[a].played++;
    stats[h].gf += hg; stats[h].ga += ag;
    stats[a].gf += ag; stats[a].ga += hg;
    if (hg > ag)      { stats[h].wins++; stats[a].losses++; stats[h].points += 3; }
    else if (ag > hg) { stats[a].wins++; stats[h].losses++; stats[a].points += 3; }
    else              { stats[h].draws++; stats[a].draws++; stats[h].points++; stats[a].points++; }
    stats[h].fairPlay += (parseInt(m.homeYellow)||0)*-1 + (parseInt(m.homeRed)||0)*-3;
    stats[a].fairPlay += (parseInt(m.awayYellow)||0)*-1 + (parseInt(m.awayRed)||0)*-3;
  });
  for (let t in stats) stats[t].gd = stats[t].gf - stats[t].ga;
  return teams
    .map(t => ({ team:t, group:groupId, ...stats[t] }))
    .sort((a,b) => b.points - a.points || b.gd - a.gd || b.gf - a.gf);
}

// ── Is a group fully played? ──────────────────────────────────
function isGroupComplete(groupId, matches) {
  const gm = matches.filter(m => m.group === groupId && !m.isKO);
  return gm.length > 0 && gm.every(m => m.status === 'Played');
}

// ── Build all group standings ─────────────────────────────────
function buildAllStandings(matches) {
  const result = {};
  ALL_GROUPS.forEach(g => {
    const gm = matches.filter(m => m.group === g && !m.isKO);
    result[g] = {
      standings: computeGroup(g, gm),
      complete:  isGroupComplete(g, matches),
      played:    gm.filter(m => m.status === 'Played').length,
      total:     gm.length,
    };
  });
  return result;
}

// ── Render Section 1: Qualified teams ────────────────────────
function renderQualified(groupData) {
  let html = '';

  html += `<div class="st-section">
    <div class="st-section-title">✅ Qualified for Round of 32</div>
    <div class="st-section-sub">Top 2 from each group · 24 guaranteed spots</div>
  </div>`;

  html += `<div class="qualified-grid">`;
  ALL_GROUPS.forEach(g => {
    const { standings, complete } = groupData[g];
    const color = GRP_COLORS[g] || { bg:'#f3f4f6', txt:'#374151', acc:'#6b7280' };
    const top2 = standings.slice(0, 2);

    html += `<div class="qual-group-card">
      <div class="qual-group-label" style="background:${color.bg}20;color:${color.txt};border-color:${color.acc}30;">
        Group ${g}
      </div>`;

    top2.forEach((team, i) => {
      const hasPlayed = team.played > 0;
      const nameClass = (!hasPlayed && !complete) ? 'qual-team-name pending' : 'qual-team-name';
      const posClass  = i === 0 ? 'qual-team-row q1' : 'qual-team-row q2';
      // Strip flag emoji for compact display (keep team name up to first space+emoji)
      const displayName = team.team;
      html += `<div class="${posClass}">
        <span class="qual-pos">${i+1}</span>
        <span class="${nameClass}" title="${escHtml(displayName)}">${escHtml(displayName)}</span>
        <span class="qual-pts-label">pts</span>
        <span class="qual-pts">${team.points}</span>
      </div>`;
    });

    html += `</div>`;
  });

  html += `</div>`; // qualified-grid
  return html;
}

// ── Render Section 2: Best 3rd Place Race ────────────────────
function renderBubble(groupData) {
  // Collect all 3rd-place teams
  const thirds = ALL_GROUPS.map(g => {
    const { standings, complete, played } = groupData[g];
    const team = standings[2]; // 3rd place
    return { ...team, groupComplete: complete, groupPlayed: played };
  });

  // Sort by pts → gd → gf (same as FIFA tiebreaker for best 3rd)
  thirds.sort((a,b) => b.points - a.points || b.gd - a.gd || b.gf - a.gf || b.fairPlay - a.fairPlay);

  // Top 8 go through, positions 9-12 eliminated
  const ADVANCE = 8;

  // Figure out the cut: what's the pts/gd of position 8 vs 9
  const p8 = thirds[7];
  const p9 = thirds[8];
  const cutTied = p8 && p9 && (p8.points === p9.points && p8.gd === p9.gd && p8.gf === p9.gf);

  // Count how many are clearly through vs on bubble
  let clearlyThrough = 0;
  let onBubble = 0;
  thirds.forEach((t, i) => {
    if (i < ADVANCE) {
      // "Clearly through" only if separated from cutoff
      if (!cutTied || i < 7) clearlyThrough++;
      else onBubble++;
    } else {
      if (cutTied) onBubble++;
    }
  });

  let html = '';

  html += `<div class="st-section" style="padding-top:16px;">
    <div class="st-section-title">🔥 Best 3rd Place Race</div>
    <div class="st-section-sub">8 of 12 third-place teams advance · sorted by Pts → GD → GF</div>
  </div>`;

  // Legend
  html += `<div class="bubble-legend">
    <div class="legend-item"><div class="legend-dot" style="background:#10b981;"></div>Advancing (top 8)</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--warning);"></div>On the bubble</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--border);"></div>Eliminated</div>
  </div>`;

  html += `<div style="padding:10px 14px 0;">`;
  html += `<div class="bubble-wrap">`;
  html += `<table class="bubble-table">
    <thead>
      <tr>
        <th>#</th>
        <th style="text-align:left;padding-left:12px;">Team</th>
        <th>P</th>
        <th>W</th>
        <th>D</th>
        <th>L</th>
        <th>GD</th>
        <th>TCS</th>
        <th>Pts</th>
      </tr>
    </thead>
    <tbody>`;

  thirds.forEach((t, i) => {
    const rank = i + 1;
    const isThrough = rank <= ADVANCE;
    const isCutEdge = rank === ADVANCE; // last advancing spot
    const isBubble  = cutTied && (rank === ADVANCE || rank === ADVANCE + 1);

    let rowClass = '';
    let ptsClass = 'pts-bold';
    if (isBubble)       { rowClass = 'bubble'; ptsClass = 'pts-bubble'; }
    else if (isThrough) { rowClass = 'through'; ptsClass = 'pts-through'; }

    const color = GRP_COLORS[t.group] || { bg:'#f3f4f6', txt:'#374151' };
    const groupBadge = `<span class="grp-badge" style="background:${color.bg};color:${color.txt};">${t.group}</span>`;

    const gdStr = t.gd > 0 ? `+${t.gd}` : `${t.gd}`;

    html += `<tr class="${rowClass}">
      <td style="font-weight:900;color:${isThrough ? '#10b981' : 'var(--text-3)'};">${rank}</td>
      <td style="text-align:left;padding-left:12px;">
        <div style="display:flex;align-items:center;gap:0;">
          ${groupBadge}<span style="font-weight:700;font-size:11px;">${escHtml(t.team)}</span>
        </div>
      </td>
      <td>${t.played}</td>
      <td>${t.wins}</td>
      <td>${t.draws}</td>
      <td>${t.losses}</td>
      <td>${t.played > 0 ? gdStr : '—'}</td>
      <td>${t.played > 0 ? t.fairPlay : '—'}</td>
      <td class="${ptsClass}">${t.points}</td>
    </tr>`;

    // Cut line after position 8
    if (rank === ADVANCE && !cutTied) {
      html += `<tr class="bubble-cutline">
        <td colspan="9" style="padding:0;height:0;position:relative;">
          <span class="cutline-label">cut ✂</span>
        </td>
      </tr>`;
    }
  });

  html += `</tbody></table>`;
  html += `</div>`; // bubble-wrap
  html += `</div>`; // padding wrapper

  // Footnote
  html += `<div style="padding:8px 14px 4px;font-size:10px;color:var(--text-3);line-height:1.6;">
    * Best 3rd-place tiebreaker: Pts → GD → GF → FIFA fair play · Final allocation after all group games complete.
  </div>`;

  return html;
}

// ── Main render ───────────────────────────────────────────────
function renderStandings(groupData) {
  // Header stats
  let through = 0;
  let groupsDone = 0;

  ALL_GROUPS.forEach(g => {
    const { standings, complete } = groupData[g];
    if (complete) groupsDone++;
    // Count clearly qualified (top 2 with played > 0 and group has some games)
    standings.slice(0, 2).forEach(t => { if (t.played > 0) through++; });
  });

  // "On bubble" = 3rd-place teams with same pts/gd as the current 8th-best 3rd
  const thirds = ALL_GROUPS.map(g => groupData[g].standings[2])
    .sort((a,b) => b.points - a.points || b.gd - a.gd || b.gf - a.gf);
  const p8 = thirds[7], p9 = thirds[8];
  const bubbleCount = (p8 && p9 && p8.points === p9.points && p8.gd === p9.gd) ? 2 : 0;

  document.getElementById('statThrough').textContent  = through;
  document.getElementById('statBubble').textContent   = bubbleCount || '—';
  document.getElementById('statGroupsDone').textContent = `${groupsDone}/12`;

  // Check if any matches have been played at all
  const anyPlayed = allMatches.some(m => m.status === 'Played' && !m.isKO);

  let html = '';

  if (!anyPlayed) {
    html += `<div class="no-data-note">
      🏁 The tournament starts 11 June 2026.<br>Standings will appear once matches are played.
    </div>`;
  } else {
    html += renderQualified(groupData);
    html += renderBubble(groupData);
  }

  document.getElementById('standingsContent').innerHTML = html;
}

// ── Load ──────────────────────────────────────────────────────
async function loadStandings() {
  try {
    allMatches = await loadAllMatches();
    window._allMatches = allMatches;
    const groupData = buildAllStandings(allMatches);
    renderStandings(groupData);
  } catch(err) {
    console.error(err);
    document.getElementById('standingsContent').innerHTML =
      `<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-txt">Failed to load standings</div></div>`;
    showToast('Failed to load standings', 'error');
  }
}

async function syncStandings() {
  showToast('Refreshing…');
  allMatches = await loadAllMatches(true);
  window._allMatches = allMatches;
  const groupData = buildAllStandings(allMatches);
  renderStandings(groupData);
  showToast('✅ Updated');
}

window.onload = async function() {
  document.getElementById('scoreModalMount').innerHTML = renderScoreModalHTML();
  await initPageAuth({
    activePage: 'standings',
    onReady: async () => {
      await loadStandings();
      showMainApp();
    }
  });
};
</script>
</body>
</html>
