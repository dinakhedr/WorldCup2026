<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Today's Matches · World Cup 2026</title>
  <!-- PWA & Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="images/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
  <link rel="shortcut icon" href="images/icon-192.png">
  <meta name="apple-mobile-web-app-title" content="WC2026">
  <meta name="theme-color" content="#0D1B3E">
  <!-- Fonts & Styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js"></script>
  <script src="utils.js"></script>
  <style>
    /* Date picker styles (only for Today page) */
    .date-picker-wrap {
      margin: 8px 16px 4px;
      display: flex;
      justify-content: center;
    }
    .date-input-native {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 40px;
      padding: 8px 20px;
      font-family: 'Lato', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--gold);
      cursor: pointer;
      text-align: center;
      width: auto;
      min-width: 200px;
    }
    .date-input-native::-webkit-calendar-picker-indicator {
      filter: invert(0.8);
      cursor: pointer;
    }
  </style>
</head>
<body>

<!-- LOADING SCREEN -->
<div class="screen active" id="loadingScreen">
  <div class="screen-card" id="loadingBox">
    <span class="screen-trophy">📅</span>
    <div class="screen-title">Today's Matches</div>
    <div class="screen-sub" id="loadingMsg">Loading schedule…</div>
    <div class="spinner"></div>
  </div>
</div>

<!-- MAIN APP -->
<div id="mainApp" style="display:none;">

  <div class="page-header">
    <div class="header-row">
      <div class="header-left">
        <a class="back-btn" href="Home.html">‹</a>
        <div class="page-title">📅 Today's Matches</div>
      </div>
      <div class="header-actions">
        <button class="hdr-btn" onclick="syncTodayMatches()" title="Refresh">🔄</button>
      </div>
    </div>

    <!-- Three stat cards (dynamic for selected date) -->
    <div class="mini-stats">
      <div class="mini-stat"><div class="mini-stat-val" id="todayCount">—</div><div class="mini-stat-lbl">Matches</div></div>
      <div class="mini-stat"><div class="mini-stat-val" id="todayPlayed">—</div><div class="mini-stat-lbl">Played</div></div>
      <div class="mini-stat"><div class="mini-stat-val" id="todayUpcoming">—</div><div class="mini-stat-lbl">Upcoming</div></div>
    </div>

    <!-- Visible date picker (native) -->
    <div class="date-picker-wrap">
      <input type="date" id="datePickerInput" class="date-input-native">
    </div>

  </div>

  <!-- Match list for selected date -->
  <div class="content" id="todayMatchList">
    <div class="loading-state"><div class="spinner"></div></div>
  </div>

  <!-- Bottom nav spacer (prevents content from hiding behind fixed nav) -->
  <div class="bottom-nav-spacer"></div>

</div>

<div id="scoreModalMount"></div>
<div id="bottomNavMount"></div>
<div class="toast" id="toast"></div>

<script>
let allMatches = [];
let selectedDate = '';
let selectedDateISO = '';

window._onScoreSaved = async function() { await loadDataAndRefresh(); };

function toISODate(dateStr) {
  if (!dateStr) return '';
  const parts = dateStr.split('-');
  if (parts.length !== 3) return '';
  const months = {Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',
                  Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};
  const month = months[parts[1]];
  if (!month) return '';
  const day = parts[0].padStart(2,'0');
  const year = `20${parts[2]}`;
  return `${year}-${month}-${day}`;
}

function fromISODate(isoStr) {
  if (!isoStr) return '';
  const date = new Date(isoStr);
  if (isNaN(date)) return '';
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const d = String(date.getDate()).padStart(2,'0');
  const m = months[date.getMonth()];
  const y = String(date.getFullYear()).slice(-2);
  return `${d}-${m}-${y}`;
}

function getTodayCairoFormatted() {
  const now = new Date();
  const cairo = new Date(now.toLocaleString('en-US', { timeZone: 'Africa/Cairo' }));
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const d = String(cairo.getDate()).padStart(2,'0');
  const m = months[cairo.getMonth()];
  const y = String(cairo.getFullYear()).slice(-2);
  return `${d}-${m}-${y}`;
}

async function loadDataAndRefresh() {
  try {
    allMatches = await loadAllMatches();
    window._allMatches = allMatches;
    if (!selectedDate) {
      selectedDate = getTodayCairoFormatted();
      selectedDateISO = toISODate(selectedDate);
      const datePicker = document.getElementById('datePickerInput');
      if (datePicker) datePicker.value = selectedDateISO;
    }
    updateForSelectedDate();
  } catch (err) {
    console.error(err);
    document.getElementById('todayMatchList').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">⚠️</div>
        <div class="empty-txt">Could not load matches<br>Tap refresh to retry</div>
      </div>`;
    showToast('Failed to load', 'error');
  }
}

function updateForSelectedDate() {
  const matchesOnDate = allMatches.filter(m => m.date === selectedDate);
  const played = matchesOnDate.filter(m => m.status === 'Played').length;
  const upcoming = matchesOnDate.filter(m => m.status !== 'Played').length;
  
  document.getElementById('todayCount').textContent = matchesOnDate.length;
  document.getElementById('todayPlayed').textContent = played;
  document.getElementById('todayUpcoming').textContent = upcoming;
  
  renderMatchesList(matchesOnDate, selectedDate);
}

function renderMatchesList(matches, date) {
  const container = document.getElementById('todayMatchList');
  if (!matches.length) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🏖️</div>
        <div class="empty-txt">No matches scheduled for<br>${formatDateLabel(date)}</div>
      </div>`;
    return;
  }
  const sorted = [...matches].sort((a,b) => (a.time || '00:00').localeCompare(b.time || '00:00'));
  let html = `<div class="date-label">📆 ${formatDateLabel(date)}</div>`;
  sorted.forEach(m => {
    html += matchCardHTML(m, { showDate: false, onclick: `openScoreModal(${m.num})` });
  });
  container.innerHTML = html;
}

function setupDatePicker() {
  const datePicker = document.getElementById('datePickerInput');
  if (!datePicker) return;
  
  const todayISO = toISODate(getTodayCairoFormatted());
  datePicker.value = todayISO;
  selectedDateISO = todayISO;
  selectedDate = fromISODate(todayISO);
  
  datePicker.addEventListener('change', (e) => {
    const newISODate = e.target.value;
    if (newISODate) {
      selectedDateISO = newISODate;
      selectedDate = fromISODate(newISODate);
      updateForSelectedDate();
    }
  });
}

async function syncTodayMatches() {
  showToast('Refreshing…');
  try {
    await loadDataAndRefresh();
    showToast('✅ Updated');
  } catch(e) {
    showToast('Refresh failed', 'error');
  }
}

window.onload = async function() {
  document.getElementById('scoreModalMount').innerHTML = renderScoreModalHTML();
  await initPageAuth({
    activePage: 'today',
    onReady: async () => {
      await loadDataAndRefresh();
      setupDatePicker();
      showMainApp();
    }
  });
};
</script>
</body>
</html>
