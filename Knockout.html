<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Knockout Stage · World Cup 2026</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="images/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
  <link rel="shortcut icon" href="images/icon-192.png">
  <meta name="apple-mobile-web-app-title" content="WC2026">
  <meta name="theme-color" content="#0D1B3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js"></script>
  <script src="utils.js"></script>
</head>
<body>

<div class="screen active" id="loadingScreen">
  <div class="screen-card" id="loadingBox">
    <span class="screen-trophy">⚡</span>
    <div class="screen-title">Knockout Stage</div>
    <div class="screen-sub" id="loadingMsg">Loading bracket…</div>
    <div class="spinner"></div>
  </div>
</div>

<div id="mainApp" style="display:none;">

  <div class="page-header">
    <div class="header-row">
      <div class="header-left">
        <a class="back-btn" href="Home.html">‹</a>
        <div class="page-title">⚡ Knockout Stage</div>
      </div>
      <div class="header-actions">
        <button class="hdr-btn" onclick="syncKnockout()" title="Refresh">🔄</button>
      </div>
    </div>
    <div class="mini-stats">
      <div class="mini-stat"><div class="mini-stat-val" id="totalKO">—</div><div class="mini-stat-lbl">Matches</div></div>
      <div class="mini-stat"><div class="mini-stat-val" id="playedKO">—</div><div class="mini-stat-lbl">Played</div></div>
      <div class="mini-stat"><div class="mini-stat-val" id="remainingKO">—</div><div class="mini-stat-lbl">Remaining</div></div>
    </div>
  </div>

  <div class="ko-wrap" id="koWrap">
    <div class="loading-state"><div class="spinner"></div></div>
  </div>

  <div class="bottom-nav-spacer"></div>
</div>

<div id="scoreModalMount"></div>
<div id="bottomNavMount"></div>
<div class="toast" id="toast"></div>

<script>
window._onScoreSaved = async function() { await loadKnockout(); };

/* ── Build a single match card (identical to before) ── */
function buildKOCard(m) {
  if (!m) {
    return `<div class="ko-card" style="opacity:0;pointer-events:none;">
      <div class="ko-card-meta">—</div>
      <div class="ko-team"><span class="ko-team-name tbd">TBD</span></div>
      <div class="ko-team"><span class="ko-team-name tbd">TBD</span></div>
      <div class="ko-card-venue">—</div>
    </div>`;
  }

  const played  = m.status === 'Played';
  const homeWin = played && m.winner === m.home;
  const awayWin = played && m.winner === m.away;
  const homeTBD = m.home.startsWith('TBD');
  const awayTBD = m.away.startsWith('TBD');

  const homeNameClass = `ko-team-name${homeTBD ? ' tbd' : homeWin ? ' winner' : ''}`;
  const awayNameClass = `ko-team-name${awayTBD ? ' tbd' : awayWin ? ' winner' : ''}`;
  const homeScoreClass = `ko-team-score${homeWin ? ' winner' : ''}`;
  const awayScoreClass = `ko-team-score${awayWin ? ' winner' : ''}`;

  const homeScore = played ? `<span class="${homeScoreClass}">${m.homeScore}</span>` : '';
  const awayScore = played ? `<span class="${awayScoreClass}">${m.awayScore}</span>` : '';

  const penLine = (played && m.penH !== '' && m.penA !== '')
    ? `<div class="ko-pen">Pen ${m.penH}–${m.penA}</div>` : '';

  const metaLine = `${formatTime12(m.time)} · ${m.date}`;
  const venue = m.city ? `📍 ${m.city}` : '';

  return `
    <div class="ko-card${played ? ' played' : ''}" onclick="openScoreModal(${m.num})">
      <div class="ko-card-meta">${metaLine}</div>
      <div class="ko-team">
        <span class="${homeNameClass}">${escHtml(m.home || 'TBD')}</span>
        ${homeScore}
      </div>
      <div class="ko-team">
        <span class="${awayNameClass}">${escHtml(m.away || 'TBD')}</span>
        ${awayScore}
      </div>
      ${penLine}
      ${venue ? `<div class="ko-card-venue">${venue}</div>` : ''}
    </div>`;
}

/* ── Build a connector column (pairCount pairs) ── */
function buildConnector(pairCount) {
  let pairs = '';
  for (let i = 0; i < pairCount; i++) {
    pairs += `
      <div class="ko-conn-pair">
        <div class="ko-conn-left"></div>
        <div class="ko-conn-stub"></div>
      </div>`;
  }
  return `<div class="ko-connector-wrapper">${pairs}</div>`;
}

/* ── Build a round column for a given half ── */
function buildRoundColumn(title, matchList, slotsCount) {
  const padded = [...matchList];
  while (padded.length < slotsCount) padded.push(null);
  const slots = padded.map(m => `<div class="ko-slot">${buildKOCard(m)}</div>`).join('');
  return `
    <div class="ko-round-col">
      <div class="ko-round-title">${title}</div>
      <div class="ko-round-body">${slots}</div>
    </div>`;
}

/* ── Build the two‑sided bracket ── */
function renderBracket(matches, allMatches) {
  const wrap = document.getElementById('koWrap');

  if (!matches.length) {
    wrap.innerHTML = `<div class="empty-state"><div class="empty-icon">🏆</div><div class="empty-txt">No knockout matches found</div></div>`;
    return;
  }

  // Resolve R32 TBDs using the same logic as before
  const { standings, thirdPlaceTeams } = buildAllStandings(allMatches);
  matches = matches.map(m => {
    if (m.group !== 'Round of 32') return m;
    const seeding = R32_SEEDING[m.num];
    if (!seeding) return m;
    const resolvedHome = resolveR32Slot(seeding.home, standings, thirdPlaceTeams, allMatches);
    const resolvedAway = resolveR32Slot(seeding.away, standings, thirdPlaceTeams, allMatches);
    return {
      ...m,
      home: resolvedHome || m.home,
      away: resolvedAway || m.away,
    };
  });

  // Group by round
  const byRound = {};
  ['Round of 32','Round of 16','Quarter-Final','Semi-Final','Bronze Medal','Final']
    .forEach(r => byRound[r] = []);
  matches.forEach(m => { if (byRound[m.group]) byRound[m.group].push(m); });

  // Sort each round by match number
  ['Round of 32','Round of 16','Quarter-Final','Semi-Final'].forEach(r =>
    byRound[r].sort((a,b) => a.num - b.num));

  const r32 = byRound['Round of 32'];   // 16
  const r16 = byRound['Round of 16'];   // 8
  const qf  = byRound['Quarter-Final']; // 4
  const sf  = byRound['Semi-Final'];    // 2
  const bronze = byRound['Bronze Medal'];
  const finalM = byRound['Final'];

  // Split each round into top and bottom halves
  const half = (arr, start) => arr.slice(start, start + arr.length/2);

  const topR32 = half(r32, 0);
  const botR32 = half(r32, 8);
  const topR16 = half(r16, 0);
  const botR16 = half(r16, 4);
  const topQF  = half(qf, 0);
  const botQF  = half(qf, 2);
  const topSF  = half(sf, 0);
  const botSF  = half(sf, 1);

  // Build the bracket HTML
  let html = `<div class="ko-bracket">`;

  // ── Top half ──
  html += `<div class="ko-half">`;
  html += buildRoundColumn('Round of 32', topR32, 8);
  html += buildConnector(4);
  html += buildRoundColumn('Round of 16', topR16, 4);
  html += buildConnector(2);
  html += buildRoundColumn('Quarter-Final', topQF, 2);
  html += buildConnector(1);
  html += buildRoundColumn('Semi-Final', topSF, 1);
  html += `</div>`;

  // ── Centre: Final and Bronze ──
  html += `<div class="ko-centre">`;
  html += `<div class="ko-round-title">🏆 Final</div>`;
  html += `<div class="ko-slot">${buildKOCard(finalM[0] || null)}</div>`;
  if (bronze && bronze.length) {
    html += `<div style="margin-top:12px;"><div class="ko-round-title" style="font-size:8px;">🥉 Bronze Medal</div>`;
    html += `<div class="ko-slot">${buildKOCard(bronze[0] || null)}</div></div>`;
  }
  html += `</div>`;

  // ── Bottom half ──
  html += `<div class="ko-half">`;
  html += buildRoundColumn('Semi-Final', botSF, 1);
  html += buildConnector(1);
  html += buildRoundColumn('Quarter-Final', botQF, 2);
  html += buildConnector(2);
  html += buildRoundColumn('Round of 16', botR16, 4);
  html += buildConnector(4);
  html += buildRoundColumn('Round of 32', botR32, 8);
  html += `</div>`;

  html += `</div>`; // .ko-bracket

  wrap.innerHTML = html;
}

async function loadKnockout() {
  try {
    const allMatches = await loadAllMatches();
    window._allMatches = allMatches;
    const koMatches = allMatches.filter(m => m.isKO);

    const total     = koMatches.length;
    const played    = koMatches.filter(m => m.status === 'Played').length;
    const remaining = total - played;

    document.getElementById('totalKO').textContent     = total;
    document.getElementById('playedKO').textContent    = played;
    document.getElementById('remainingKO').textContent = remaining;

    renderBracket(koMatches, allMatches);
  } catch(err) {
    console.error(err);
    document.getElementById('koWrap').innerHTML =
      `<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-txt">Failed to load knockout stage</div></div>`;
    showToast('Failed to load knockout matches', 'error');
  }
}

async function syncKnockout() {
  showToast('Refreshing…');
  await loadAllMatches(true);
  await loadKnockout();
  showToast('✅ Updated');
}

window.onload = async function() {
  document.getElementById('scoreModalMount').innerHTML = renderScoreModalHTML();
  await initPageAuth({
    activePage: 'knockout',
    onReady: async () => {
      await loadKnockout();
      showMainApp();
    }
  });
};
</script>
</body>
</html>
