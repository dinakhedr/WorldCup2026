<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Knockout Stage · World Cup 2026</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="images/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
  <link rel="shortcut icon" href="images/icon-192.png">
  <meta name="apple-mobile-web-app-title" content="WC2026">
  <meta name="theme-color" content="#0D1B3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js"></script>
  <script src="utils.js"></script>
  <style>
    /* ── Bracket layout ── */
    .ko-wrap {
      overflow-x: auto;
      overflow-y: visible;
      -webkit-overflow-scrolling: touch;
      padding: 12px 0 8px;
      /* flex: 1 so it fills the mainApp column and the spacer still works */
      flex: 1;
    }

    /* The outer bracket flex row — grows as tall as needed */
    .ko-bracket {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      width: max-content;
      min-width: 100%;
      padding: 0 10px 16px;
      gap: 0;
    }

    /* One round column */
    .ko-round {
      display: flex;
      flex-direction: column;
      width: 168px;
      flex-shrink: 0;
    }
    .ko-round-title {
      font-size: 9px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.45);
      text-align: center;
      padding: 0 6px 10px;
      white-space: nowrap;
    }
    .ko-round-body {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    /* Each "slot" stretches evenly in the column */
    .ko-slot {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      padding: 5px 6px;
      position: relative;
      min-height: 90px;
    }

    /* Match card inside a slot */
    .ko-card {
      background: var(--surface);
      border-radius: 10px;
      border: 1px solid var(--border);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s;
      position: relative;
    }
    .ko-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0; width: 3px;
      background: var(--border);
      border-radius: 3px 0 0 3px;
    }
    .ko-card.played::before { background: var(--green-mid); }
    .ko-card:active { transform: scale(0.97); }

    .ko-card-meta {
      padding: 5px 9px 3px 11px;
      font-size: 9px;
      font-weight: 700;
      color: var(--text-3);
      letter-spacing: 0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ko-team {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 9px 4px 11px;
      gap: 4px;
      border-top: 1px solid var(--border);
    }
    .ko-team:first-of-type { border-top: none; }

    .ko-team-name {
      font-size: 11px;
      font-weight: 700;
      color: var(--text);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ko-team-name.tbd {
      color: var(--text-3);
      font-weight: 600;
      font-style: normal; /* never italic */
    }
    .ko-team-name.winner { color: var(--green-mid); }

    .ko-team-score {
      font-size: 13px;
      font-weight: 900;
      color: var(--text-3);
      min-width: 14px;
      text-align: right;
      flex-shrink: 0;
    }
    .ko-team-score.winner { color: var(--green-mid); }

    .ko-card-venue {
      font-size: 8px;
      color: var(--text-3);
      padding: 2px 9px 5px 11px;
      border-top: 1px solid var(--border);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ko-card.played .ko-card-venue { color: #059669; }

    /* Penalty line */
    .ko-pen {
      font-size: 8px;
      font-weight: 700;
      color: #b45309;
      padding: 1px 9px 4px 11px;
      border-top: none;
    }

    /* ── Connector column between rounds ── */
    .ko-connector {
      width: 28px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      /* title spacer — matches ko-round-title height */
      padding-top: 27px;
    }

    /* Each connector pair: top half + bottom half + horizontal stub */
    .ko-conn-pair {
      flex: 2; /* matches 2 left slots → 1 right slot */
      display: flex;
      flex-direction: row;
    }
    .ko-conn-lines {
      width: 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .ko-conn-top {
      flex: 1;
      border-right: 2px solid rgba(255,255,255,0.18);
      border-bottom: 2px solid rgba(255,255,255,0.18);
      border-bottom-right-radius: 4px;
    }
    .ko-conn-bot {
      flex: 1;
      border-right: 2px solid rgba(255,255,255,0.18);
      border-top: 2px solid rgba(255,255,255,0.18);
      border-top-right-radius: 4px;
    }
    .ko-conn-stub {
      width: 14px;
      border-top: 2px solid rgba(255,255,255,0.18);
      align-self: center;
      flex-shrink: 0;
    }

    /* ── Bronze & Final section (vertical below bracket) ── */
    .ko-finals-row {
      display: flex;
      flex-direction: row;
      gap: 10px;
      padding: 0 10px 16px;
      width: max-content;
      min-width: 100%;
    }
    .ko-finals-block {
      width: 168px;
      flex-shrink: 0;
    }
    .ko-finals-title {
      font-size: 9px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.45);
      padding: 0 6px 10px;
      white-space: nowrap;
    }

    /* Divider between main bracket and finals */
    .ko-divider {
      margin: 4px 10px 12px;
      height: 1px;
      background: rgba(255,255,255,0.08);
    }
  </style>
</head>
<body>

<div class="screen active" id="loadingScreen">
  <div class="screen-card" id="loadingBox">
    <span class="screen-trophy">⚡</span>
    <div class="screen-title">Knockout Stage</div>
    <div class="screen-sub" id="loadingMsg">Loading bracket…</div>
    <div class="spinner"></div>
  </div>
</div>

<div id="mainApp" style="display:none;">

  <div class="page-header">
    <div class="header-row">
      <div class="header-left">
        <a class="back-btn" href="Home.html">‹</a>
        <div class="page-title">⚡ Knockout Stage</div>
      </div>
      <div class="header-actions">
        <button class="hdr-btn" onclick="syncKnockout()" title="Refresh">🔄</button>
      </div>
    </div>
    <div class="mini-stats">
      <div class="mini-stat"><div class="mini-stat-val" id="totalKO">—</div><div class="mini-stat-lbl">Matches</div></div>
      <div class="mini-stat"><div class="mini-stat-val" id="playedKO">—</div><div class="mini-stat-lbl">Played</div></div>
      <div class="mini-stat"><div class="mini-stat-val" id="remainingKO">—</div><div class="mini-stat-lbl">Remaining</div></div>
    </div>
  </div>

  <div class="ko-wrap" id="koWrap">
    <div class="loading-state"><div class="spinner"></div></div>
  </div>

  <div class="bottom-nav-spacer"></div>
</div>

<div id="scoreModalMount"></div>
<div id="bottomNavMount"></div>
<div class="toast" id="toast"></div>

<script>
window._onScoreSaved = async function() { await loadKnockout(); };

/* ── R32 seeding table (fixed by FIFA) ── */
const R32_SEEDING = {
  73:  { home:{grp:'A', rank:'2'}, away:{grp:'B', rank:'2'} },
  74:  { home:{grp:'E', rank:'1'}, away:{grp:'A/B/C/D/F', rank:'3'} },
  75:  { home:{grp:'F', rank:'1'}, away:{grp:'C', rank:'2'} },
  76:  { home:{grp:'C', rank:'1'}, away:{grp:'F', rank:'2'} },
  77:  { home:{grp:'I', rank:'1'}, away:{grp:'C/D/F/G/H', rank:'3'} },
  78:  { home:{grp:'E', rank:'2'}, away:{grp:'I', rank:'2'} },
  79:  { home:{grp:'A', rank:'1'}, away:{grp:'C/E/F/H/I', rank:'3'} },
  80:  { home:{grp:'L', rank:'1'}, away:{grp:'E/H/I/J/K', rank:'3'} },
  81:  { home:{grp:'D', rank:'1'}, away:{grp:'B/E/F/I/J', rank:'3'} },
  82:  { home:{grp:'G', rank:'1'}, away:{grp:'A/E/H/I/J', rank:'3'} },
  83:  { home:{grp:'K', rank:'2'}, away:{grp:'L', rank:'2'} },
  84:  { home:{grp:'H', rank:'1'}, away:{grp:'J', rank:'2'} },
  85:  { home:{grp:'B', rank:'1'}, away:{grp:'E/F/G/I/J', rank:'3'} },
  86:  { home:{grp:'J', rank:'1'}, away:{grp:'H', rank:'2'} },
  87:  { home:{grp:'K', rank:'1'}, away:{grp:'D/E/I/J/L', rank:'3'} },
  88:  { home:{grp:'D', rank:'2'}, away:{grp:'G', rank:'2'} },
};

/* ── Compute standings for a single group ── */
function computeStandingsForGroup(groupId, allMatches) {
  const teams = GROUPS_TEAMS[groupId] || [];
  const stats = {};
  teams.forEach(t => { stats[t] = { played:0, wins:0, draws:0, losses:0, gf:0, ga:0, gd:0, points:0, fairPlay:0 }; });

  allMatches.filter(m => m.group === groupId).forEach(m => {
    if (m.status !== 'Played') return;
    const h = m.home, a = m.away;
    if (!stats[h] || !stats[a]) return;
    const hg = parseInt(m.homeScore)||0, ag = parseInt(m.awayScore)||0;
    stats[h].played++; stats[a].played++;
    stats[h].gf += hg; stats[h].ga += ag;
    stats[a].gf += ag; stats[a].ga += hg;
    if (hg > ag)      { stats[h].wins++; stats[a].losses++; stats[h].points += 3; }
    else if (ag > hg) { stats[a].wins++; stats[h].losses++; stats[a].points += 3; }
    else              { stats[h].draws++; stats[a].draws++; stats[h].points++; stats[a].points++; }
    stats[h].fairPlay += (parseInt(m.homeYellow)||0)*-1 + (parseInt(m.homeRed)||0)*-3;
    stats[a].fairPlay += (parseInt(m.awayYellow)||0)*-1 + (parseInt(m.awayRed)||0)*-3;
  });
  for (let t in stats) stats[t].gd = stats[t].gf - stats[t].ga;

  function getH2H(tied) {
    const h2h = {};
    tied.forEach(t => { h2h[t] = { points:0, gd:0, gf:0 }; });
    allMatches.filter(m => m.group === groupId && m.status === 'Played' && tied.includes(m.home) && tied.includes(m.away)).forEach(m => {
      const hg = parseInt(m.homeScore)||0, ag = parseInt(m.awayScore)||0;
      h2h[m.home].gf += hg; h2h[m.home].gd += hg-ag;
      h2h[m.away].gf += ag; h2h[m.away].gd += ag-hg;
      if (hg > ag) h2h[m.home].points += 3;
      else if (ag > hg) h2h[m.away].points += 3;
      else { h2h[m.home].points++; h2h[m.away].points++; }
    });
    return h2h;
  }

  let standings = teams.map(t => ({ team:t, ...stats[t] }));
  standings.sort((a, b) => {
    if (a.points !== b.points) return b.points - a.points;
    if (a.gd !== b.gd) return b.gd - a.gd;
    if (a.gf !== b.gf) return b.gf - a.gf;
    const tied = standings.filter(t => t.points===a.points && t.gd===a.gd && t.gf===a.gf).map(t=>t.team);
    if (tied.length === 2) {
      const h2h = getH2H(tied);
      if (h2h[a.team].points !== h2h[b.team].points) return h2h[b.team].points - h2h[a.team].points;
      if (h2h[a.team].gd !== h2h[b.team].gd) return h2h[b.team].gd - h2h[a.team].gd;
      if (h2h[a.team].gf !== h2h[b.team].gf) return h2h[b.team].gf - h2h[a.team].gf;
    }
    if (a.fairPlay !== b.fairPlay) return b.fairPlay - a.fairPlay;
    return 0;
  });
  return standings;
}

function isGroupComplete(groupId, allMatches) {
  const gm = allMatches.filter(m => m.group === groupId);
  return gm.length > 0 && gm.every(m => m.status === 'Played');
}

function resolveBestThird(eligibleStr, thirdPlaceTeams, allMatches) {
  const eligible = eligibleStr.split('/');
  if (!eligible.every(g => isGroupComplete(g, allMatches))) return null;
  let best = null;
  for (const grp of eligible) {
    const t = thirdPlaceTeams[grp];
    if (!t) continue;
    if (!best) { best = t; continue; }
    if (t.points > best.points) { best = t; continue; }
    if (t.points === best.points) {
      if (t.gd > best.gd) { best = t; continue; }
      if (t.gd === best.gd && t.gf > best.gf) { best = t; continue; }
    }
  }
  return best ? best.team : null;
}

/* ── Resolve TBD slots in R32 matches from standings ── */
function resolveR32Teams(allMatches) {
  const standings = {};
  const thirdPlaceTeams = {};
  for (const grp of ['A','B','C','D','E','F','G','H','I','J','K','L']) {
    standings[grp] = computeStandingsForGroup(grp, allMatches);
    if (standings[grp][2]) thirdPlaceTeams[grp] = standings[grp][2];
  }

  function resolveSlot(slot) {
    if (slot.rank === '3') return resolveBestThird(slot.grp, thirdPlaceTeams, allMatches);
    if (!isGroupComplete(slot.grp, allMatches)) return null;
    const st = standings[slot.grp];
    if (!st) return null;
    return st[slot.rank === '1' ? 0 : 1]?.team || null;
  }

  return { resolveSlot };
}

/* ── Build a single match card ── */
function buildKOCard(m) {
  if (!m) {
    return `<div class="ko-card" style="opacity:0;pointer-events:none;">
      <div class="ko-card-meta">—</div>
      <div class="ko-team"><span class="ko-team-name tbd">TBD</span></div>
      <div class="ko-team"><span class="ko-team-name tbd">TBD</span></div>
      <div class="ko-card-venue">—</div>
    </div>`;
  }

  const played  = m.status === 'Played';
  const homeWin = played && m.winner === m.home;
  const awayWin = played && m.winner === m.away;
  const homeTBD = m.home.startsWith('TBD');
  const awayTBD = m.away.startsWith('TBD');

  const homeNameClass = `ko-team-name${homeTBD ? ' tbd' : homeWin ? ' winner' : ''}`;
  const awayNameClass = `ko-team-name${awayTBD ? ' tbd' : awayWin ? ' winner' : ''}`;
  const homeScoreClass = `ko-team-score${homeWin ? ' winner' : ''}`;
  const awayScoreClass = `ko-team-score${awayWin ? ' winner' : ''}`;

  const homeScore = played ? `<span class="${homeScoreClass}">${m.homeScore}</span>` : '';
  const awayScore = played ? `<span class="${awayScoreClass}">${m.awayScore}</span>` : '';

  const penLine = (played && m.penH !== '' && m.penA !== '')
    ? `<div class="ko-pen">Pen ${m.penH}–${m.penA}</div>` : '';

  const metaLine = `${formatTime12(m.time)} · ${m.date}`;
  const venue = m.city ? `📍 ${m.city}` : '';

  return `
    <div class="ko-card${played ? ' played' : ''}" onclick="openScoreModal(${m.num})">
      <div class="ko-card-meta">${metaLine}</div>
      <div class="ko-team">
        <span class="${homeNameClass}">${escHtml(m.home || 'TBD')}</span>
        ${homeScore}
      </div>
      <div class="ko-team">
        <span class="${awayNameClass}">${escHtml(m.away || 'TBD')}</span>
        ${awayScore}
      </div>
      ${penLine}
      ${venue ? `<div class="ko-card-venue">${venue}</div>` : ''}
    </div>`;
}

/* ── Build a connector column (pairCount pairs, each spanning 2 left slots → 1 right slot) ── */
function buildConnector(pairCount) {
  let pairs = '';
  for (let i = 0; i < pairCount; i++) {
    pairs += `
      <div class="ko-conn-pair">
        <div class="ko-conn-lines">
          <div class="ko-conn-top"></div>
          <div class="ko-conn-bot"></div>
        </div>
        <div class="ko-conn-stub"></div>
      </div>`;
  }
  return `<div class="ko-connector">${pairs}</div>`;
}

/* ── Main render function ── */
function renderBracket(matches, allMatches) {
  const wrap = document.getElementById('koWrap');

  if (!matches.length) {
    wrap.innerHTML = `<div class="empty-state"><div class="empty-icon">🏆</div><div class="empty-txt">No knockout matches found</div></div>`;
    return;
  }

  // Resolve R32 TBD slots from group standings
  const { resolveSlot } = resolveR32Teams(allMatches);
  matches = matches.map(m => {
    if (m.group !== 'Round of 32') return m;
    const seeding = R32_SEEDING[m.num];
    if (!seeding) return m;
    const resolvedHome = resolveSlot(seeding.home);
    const resolvedAway = resolveSlot(seeding.away);
    return {
      ...m,
      home: resolvedHome || m.home,
      away: resolvedAway || m.away,
    };
  });

  // Group by round
  const byRound = {};
  ['Round of 32','Round of 16','Quarter-Final','Semi-Final','Bronze Medal','Final']
    .forEach(r => byRound[r] = []);
  matches.forEach(m => { if (byRound[m.group]) byRound[m.group].push(m); });
  ['Round of 32','Round of 16','Quarter-Final','Semi-Final'].forEach(r =>
    byRound[r].sort((a,b) => a.num - b.num));

  const r32 = byRound['Round of 32'];   // 16 matches
  const r16 = byRound['Round of 16'];   //  8 matches
  const qf  = byRound['Quarter-Final']; //  4 matches
  const sf  = byRound['Semi-Final'];    //  2 matches
  const finalMatches  = byRound['Final'];
  const bronzeMatches = byRound['Bronze Medal'];

  function roundColumn(title, matchArr, slotsCount) {
    const padded = [...matchArr];
    while (padded.length < slotsCount) padded.push(null);
    const slots = padded.map(m => `<div class="ko-slot">${buildKOCard(m)}</div>`).join('');
    return `
      <div class="ko-round">
        <div class="ko-round-title">${title}</div>
        <div class="ko-round-body">${slots}</div>
      </div>`;
  }

  const baseSlots = r32.length || 16;

  // ── Everything in ONE scrollable container ──
  let html = `<div style="display:inline-flex;flex-direction:column;min-width:100%;padding-bottom:16px;">`;

  // ── Single horizontal bracket: R32 → R16 → QF → SF → Final ──
  html += `<div class="ko-bracket">`;
  html += roundColumn('Round of 32',   r32, baseSlots);
  html += buildConnector(baseSlots / 2);
  html += roundColumn('Round of 16',   r16, baseSlots / 2);
  html += buildConnector(baseSlots / 4);
  html += roundColumn('Quarter-Final', qf,  baseSlots / 4);
  html += buildConnector(baseSlots / 8);
  html += roundColumn('Semi-Final',    sf,  baseSlots / 8);
  html += buildConnector(1);

  // ── Final + Bronze stacked in one column ──
  const bronzeM = bronzeMatches[0] || null;
  const finalM  = finalMatches[0]  || null;
  html += `
    <div class="ko-round">
      <div class="ko-round-title">🏆 Final</div>
      <div class="ko-round-body">
        <div class="ko-slot">${buildKOCard(finalM)}</div>
        ${bronzeM ? `
        <div class="ko-slot" style="border-top:1px solid rgba(255,255,255,0.08);margin-top:8px;padding-top:4px;">
          <div class="ko-round-title" style="text-align:left;padding:0 6px 8px;">🥉 BRONZE MEDAL</div>
          ${buildKOCard(bronzeM)}
        </div>` : ''}
      </div>
    </div>`;

  html += `</div>`; // .ko-bracket
  html += `</div>`; // outer inline-flex

  wrap.innerHTML = html;
}

async function loadKnockout() {
  try {
    const allMatches = await loadAllMatches();
    window._allMatches = allMatches;
    const koMatches = allMatches.filter(m => m.isKO);

    const total     = koMatches.length;
    const played    = koMatches.filter(m => m.status === 'Played').length;
    const remaining = total - played;

    document.getElementById('totalKO').textContent     = total;
    document.getElementById('playedKO').textContent    = played;
    document.getElementById('remainingKO').textContent = remaining;

    renderBracket(koMatches, allMatches);
  } catch(err) {
    console.error(err);
    document.getElementById('koWrap').innerHTML =
      `<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-txt">Failed to load knockout stage</div></div>`;
    showToast('Failed to load knockout matches', 'error');
  }
}

async function syncKnockout() {
  showToast('Refreshing…');
  await loadAllMatches(true);   // force cache bypass
  await loadKnockout();
  showToast('✅ Updated');
}

window.onload = async function() {
  document.getElementById('scoreModalMount').innerHTML = renderScoreModalHTML();
  await initPageAuth({
    activePage: 'knockout',
    onReady: async () => {
      await loadKnockout();
      showMainApp();
    }
  });
};
</script>
</body>
</html>
