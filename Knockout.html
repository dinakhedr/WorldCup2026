<body>

<div class="screen active" id="loadingScreen">
  <div class="screen-card" id="loadingBox">
    <span class="screen-trophy">⚡</span>
    <div class="screen-title">Knockout Stage</div>
    <div class="screen-sub" id="loadingMsg">Loading bracket…</div>
    <div class="spinner"></div>
  </div>
</div>

<div id="mainApp" style="display:none;">

  <div class="page-header">
    <div class="header-row">
      <div class="header-left">
        <a class="back-btn" href="Home.html">‹</a>
        <div class="page-title">⚡ Knockout Stage</div>
      </div>
      <div class="header-actions">
        <button class="hdr-btn" onclick="syncKnockout()" title="Refresh">🔄</button>
      </div>
    </div>
    <div class="mini-stats">
      <div class="mini-stat"><div class="mini-stat-val" id="totalKO">—</div><div class="mini-stat-lbl">Matches</div></div>
      <div class="mini-stat"><div class="mini-stat-val" id="playedKO">—</div><div class="mini-stat-lbl">Played</div></div>
      <div class="mini-stat"><div class="mini-stat-val" id="remainingKO">—</div><div class="mini-stat-lbl">Remaining</div></div>
    </div>
  </div>

  <div class="ko-wrap" id="koWrap">
    <div class="loading-state"><div class="spinner"></div></div>
  </div>

  <div class="bottom-nav-spacer"></div>
</div>

<div id="scoreModalMount"></div>
<div id="bottomNavMount"></div>
<div class="toast" id="toast"></div>

<script>
window._onScoreSaved = async function() { await loadKnockout(); };

/* ── Build a single match card ── */
function buildKOCard(m) {
  if (!m) {
    return `<div class="ko-card" style="opacity:0.3;pointer-events:none;">
      <div class="ko-card-meta">—</div>
      <div class="ko-team"><span class="ko-team-name tbd">TBD</span></div>
      <div class="ko-team"><span class="ko-team-name tbd">TBD</span></div>
      <div class="ko-card-venue">—</div>
    </div>`;
  }

  const played  = m.status === 'Played';
  const homeWin = played && m.winner === m.home;
  const awayWin = played && m.winner === m.away;
  const homeTBD = m.home.startsWith('TBD');
  const awayTBD = m.away.startsWith('TBD');

  const homeNameClass = `ko-team-name${homeTBD ? ' tbd' : homeWin ? ' winner' : ''}`;
  const awayNameClass = `ko-team-name${awayTBD ? ' tbd' : awayWin ? ' winner' : ''}`;
  const homeScoreClass = `ko-team-score${homeWin ? ' winner' : ''}`;
  const awayScoreClass = `ko-team-score${awayWin ? ' winner' : ''}`;

  const homeScore = played ? `<span class="${homeScoreClass}">${m.homeScore}</span>` : '';
  const awayScore = played ? `<span class="${awayScoreClass}">${m.awayScore}</span>` : '';

  const penLine = (played && m.penH !== '' && m.penA !== '')
    ? `<div class="ko-pen">Pen ${m.penH}–${m.penA}</div>` : '';

  const metaLine = `M${m.num} · ${formatCardDateTime(m.date, m.time)}`;
  const venue = m.city ? `📍 ${m.city}` : '';

  return `
    <div class="ko-card${played ? ' played' : ''}" onclick="openScoreModal(${m.num})">
      <div class="ko-card-meta">${metaLine}</div>
      <div class="ko-team">
        <span class="${homeNameClass}">${escHtml(m.home || 'TBD')}</span>
        ${homeScore}
      </div>
      <div class="ko-team">
        <span class="${awayNameClass}">${escHtml(m.away || 'TBD')}</span>
        ${awayScore}
      </div>
      ${penLine}
      ${venue ? `<div class="ko-card-venue">${venue}</div>` : ''}
    </div>`;
}

/* ── Build a column of matches with given row spans ── */
function buildColumn(title, matches, rowSpans) {
  let html = `<div class="ko-column-wrapper">
    <div class="ko-column-title">${title}</div>
    <div class="ko-column">`;
  matches.forEach((m, idx) => {
    const span = rowSpans[idx] || 1;
    html += `<div class="ko-slot" style="grid-row: span ${span};">${buildKOCard(m)}</div>`;
  });
  html += `</div></div>`;
  return html;
}

/* ── Build an SVG connector placeholder between two columns ── */
function buildConnector(id) {
  return `<div class="ko-connector" id="${id}"><svg class="ko-connector-svg" id="${id}-svg"></svg></div>`;
}

/* ── Draw all bracket lines via SVG after DOM is painted ── */
function drawBracketLines() {
  const COLOR  = 'rgba(59,130,246,0.40)';
  const STROKE = 2;

  // Left side connectors: R32→R16 (4 pairs), R16→QF (2 pairs), QF→SF (1 pair)
  [
    { id: 'lconn-0', pairs: 4, side: 'left'  },
    { id: 'lconn-1', pairs: 2, side: 'left'  },
    { id: 'lconn-2', pairs: 1, side: 'left'  },
  ].forEach(c => drawConnectorSVG(c.id, c.pairs, c.side, COLOR, STROKE));

  // Right side connectors: SF→QF (1 pair), QF→R16 (2 pairs), R16→R32 (4 pairs)
  [
    { id: 'rconn-1', pairs: 1, side: 'right' },
    { id: 'rconn-2', pairs: 2, side: 'right' },
    { id: 'rconn-3', pairs: 4, side: 'right' },
  ].forEach(c => drawConnectorSVG(c.id, c.pairs, c.side, COLOR, STROKE));
}

function drawConnectorSVG(connId, pairs, side, color, sw) {
  const conn = document.getElementById(connId);
  const svg  = document.getElementById(`${connId}-svg`);
  if (!conn || !svg) return;

  const W = conn.offsetWidth;
  const H = conn.offsetHeight - 29; // subtract title padding
  if (H <= 0) return;

  svg.setAttribute('width',   W);
  svg.setAttribute('height',  H);
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

  const slotH = H / (pairs * 2); // height per card slot
  let paths = '';

  for (let i = 0; i < pairs; i++) {
    const topY = slotH * (i * 2)       + slotH / 2; // centre of top card
    const botY = slotH * (i * 2 + 1)   + slotH / 2; // centre of bottom card
    const midY = (topY + botY) / 2;                   // merge point
    const barX = side === 'left' ? 2 : W - 2;         // vertical bar X
    const outX = side === 'left' ? W  : 0;             // outgoing horizontal X

    // Vertical bar connecting top+bottom card centres
    paths += `<line x1="${barX}" y1="${topY}" x2="${barX}" y2="${botY}" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"/>`;
    // Horizontal line from midpoint to next column
    paths += `<line x1="${barX}" y1="${midY}" x2="${outX}" y2="${midY}" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"/>`;
    // Small tick marks at top and bottom of the vertical bar
    const tickLen = 6;
    const tickX2  = side === 'left' ? barX + tickLen : barX - tickLen;
    paths += `<line x1="${barX}" y1="${topY}" x2="${tickX2}" y2="${topY}" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"/>`;
    paths += `<line x1="${barX}" y1="${botY}" x2="${tickX2}" y2="${botY}" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"/>`;
  }

  svg.innerHTML = paths;
}

/* ── Build the bracket ── */
function renderBracket(matches, allMatches) {
  const wrap = document.getElementById('koWrap');

  if (!matches.length) {
    wrap.innerHTML = `<div class="empty-state"><div class="empty-icon">🏆</div><div class="empty-txt">No knockout matches found</div></div>`;
    return;
  }

  // Resolve R32 TBDs
  const { standings, thirdPlaceTeams } = buildAllStandings(allMatches);
  matches = matches.map(m => {
    if (m.group !== 'Round of 32') return m;
    const seeding = R32_SEEDING[m.num];
    if (!seeding) return m;
    const resolvedHome = resolveR32Slot(seeding.home, standings, thirdPlaceTeams, allMatches);
    const resolvedAway = resolveR32Slot(seeding.away, standings, thirdPlaceTeams, allMatches);
    return {
      ...m,
      home: resolvedHome || m.home,
      away: resolvedAway || m.away,
    };
  });

  // Create maps for quick lookup
  const matchMap = {};
  matches.forEach(m => { matchMap[m.num] = m; });

  // Define the bracket structure for left and right sides
  // Left side (top half): R32 (73-80) -> R16 (89-92) -> QF (97-98) -> SF (101)
  // Right side (bottom half): SF (102) -> QF (99-100) -> R16 (93-96) -> R32 (81-88)
  // Centre: Final (104), Bronze (103)

// REPLACE renderBracket() match ordering:
  const leftR32 = [74,77,73,75,83,84,81,82].map(n => matchMap[n]);
  const leftR16 = [89,90,93,94].map(n => matchMap[n]);
  const leftQF  = [97,98].map(n => matchMap[n]);
  const leftSF  = [101].map(n => matchMap[n]);

  const rightSF  = [102].map(n => matchMap[n]);
  const rightQF  = [99,100].map(n => matchMap[n]);
  const rightR16 = [91,92,95,96].map(n => matchMap[n]);
  const rightR32 = [76,78,79,80,86,88,85,87].map(n => matchMap[n]);

  const finalM = matchMap[104];
  const bronzeM = matchMap[103];

  // Row spans for each round (left side, from outer to inner)
  const leftColumns = [
    { title: 'Round of 32', matches: leftR32, spans: [1,1,1,1,1,1,1,1] },
    { title: 'Round of 16', matches: leftR16, spans: [2,2,2,2] },
    { title: 'Quarter-Final', matches: leftQF, spans: [4,4] },
    { title: 'Semi-Final', matches: leftSF, spans: [8] },
  ];

  // Right side (inner to outer)
  const rightColumns = [
    { title: 'Semi-Final', matches: rightSF, spans: [8] },
    { title: 'Quarter-Final', matches: rightQF, spans: [4,4] },
    { title: 'Round of 16', matches: rightR16, spans: [2,2,2,2] },
    { title: 'Round of 32', matches: rightR32, spans: [1,1,1,1,1,1,1,1] },
  ];

  let html = `<div class="ko-bracket-row">`;

  // ── Left side ──
  html += `<div class="ko-side" id="leftSide">`;
  leftColumns.forEach((col, idx) => {
    html += buildColumn(col.title, col.matches, col.spans);
    if (idx < leftColumns.length - 1) html += buildConnector(`lconn-${idx}`);
  });
  html += `</div>`;

  // ── Centre (Final & Bronze) ──
  html += `<div class="ko-centre-col">`;
  html += `<div class="ko-round-title">🏆 Final</div>`;
  html += `<div class="ko-slot">${buildKOCard(finalM)}</div>`;
  if (bronzeM) {
    html += `<div style="margin-top:12px;"><div class="ko-round-title" style="font-size:8px;">🥉 Bronze Medal</div>`;
    html += `<div class="ko-slot">${buildKOCard(bronzeM)}</div></div>`;
  }
  html += `</div>`;

  // ── Right side ──
  html += `<div class="ko-side" id="rightSide">`;
  rightColumns.forEach((col, idx) => {
    if (idx > 0) html += buildConnector(`rconn-${idx}`);
    html += buildColumn(col.title, col.matches, col.spans);
  });
  html += `</div>`;

  html += `</div>`; // .ko-bracket-row
  wrap.innerHTML = html;

  // Draw SVG bracket lines after DOM is painted
  requestAnimationFrame(() => requestAnimationFrame(() => drawBracketLines()));
}

async function loadKnockout() {
  try {
    const allMatches = await loadAllMatches();
    window._allMatches = allMatches;
    const koMatches = allMatches.filter(m => m.isKO);

    const total     = koMatches.length;
    const played    = koMatches.filter(m => m.status === 'Played').length;
    const remaining = total - played;

    document.getElementById('totalKO').textContent     = total;
    document.getElementById('playedKO').textContent    = played;
    document.getElementById('remainingKO').textContent = remaining;

    renderBracket(koMatches, allMatches);
  } catch(err) {
    console.error(err);
    document.getElementById('koWrap').innerHTML =
      `<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-txt">Failed to load knockout stage</div></div>`;
    showToast('Failed to load knockout matches', 'error');
  }
}

async function syncKnockout() {
  showToast('Refreshing…');
  await loadAllMatches(true);
  await loadKnockout();
  showToast('✅ Updated');
}

window.onload = async function() {
  document.getElementById('scoreModalMount').innerHTML = renderScoreModalHTML();
  await initPageAuth({
    activePage: 'knockout',
    onReady: async () => {
      await loadKnockout();
      showMainApp();
    }
  });
};
</script>
</body>
</html>
