<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Knockout Stage · World Cup 2026</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="images/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
  <link rel="shortcut icon" href="images/icon-192.png">
  <meta name="apple-mobile-web-app-title" content="WC2026">
  <meta name="theme-color" content="#0D1B3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js"></script>
  <script src="utils.js"></script>
</head>
<body>

<div class="screen active" id="loadingScreen">
  <div class="screen-card" id="loadingBox">
    <span class="screen-trophy">⚡</span>
    <div class="screen-title">Knockout Stage</div>
    <div class="screen-sub" id="loadingMsg">Loading bracket…</div>
    <div class="spinner"></div>
  </div>
</div>

<div id="mainApp" style="display:none;">

  <div class="page-header">
    <div class="header-row">
      <div class="header-left">
        <a class="back-btn" href="Home.html">&#x2039;</a>
        <div class="page-title">&#x26A1; Knockout Stage</div>
      </div>
      <div class="header-actions">
        <button class="hdr-btn" onclick="syncKnockout()" title="Refresh">&#x1F504;</button>
      </div>
    </div>
    <div class="mini-stats">
      <div class="mini-stat"><div class="mini-stat-val" id="totalKO">—</div><div class="mini-stat-lbl">Matches</div></div>
      <div class="mini-stat"><div class="mini-stat-val" id="playedKO">—</div><div class="mini-stat-lbl">Played</div></div>
      <div class="mini-stat"><div class="mini-stat-val" id="remainingKO">—</div><div class="mini-stat-lbl">Remaining</div></div>
    </div>
  </div>

  <div class="ko-wrap" id="koWrap">
    <div class="loading-state"><div class="spinner"></div></div>
  </div>

  <div class="bottom-nav-spacer"></div>
</div>

<div id="scoreModalMount"></div>
<div id="bottomNavMount"></div>
<div class="toast" id="toast"></div>

<script>
window._onScoreSaved = async function() { await loadKnockout(); };

/* ── Build a single KO match card ── */
function buildKOCard(m) {
  if (!m) {
    return '<div class="ko-card" style="opacity:0.3;pointer-events:none;">' +
      '<div class="ko-card-meta">—</div>' +
      '<div class="ko-team"><span class="ko-team-name tbd">TBD</span></div>' +
      '<div class="ko-team"><span class="ko-team-name tbd">TBD</span></div>' +
      '<div class="ko-card-venue">—</div></div>';
  }

  const played   = m.status === 'Played';
  const homeWin  = played && m.winner === m.home;
  const awayWin  = played && m.winner === m.away;
  const homeTBD  = !m.home || m.home.startsWith('TBD');
  const awayTBD  = !m.away || m.away.startsWith('TBD');

  const homeNameClass  = 'ko-team-name' + (homeTBD ? ' tbd' : homeWin ? ' winner' : '');
  const awayNameClass  = 'ko-team-name' + (awayTBD ? ' tbd' : awayWin ? ' winner' : '');
  const homeScoreClass = 'ko-team-score' + (homeWin ? ' winner' : '');
  const awayScoreClass = 'ko-team-score' + (awayWin ? ' winner' : '');

  const homeScore = played ? '<span class="' + homeScoreClass + '">' + m.homeScore + '</span>' : '';
  const awayScore = played ? '<span class="' + awayScoreClass + '">' + m.awayScore + '</span>' : '';
  const penLine   = (played && m.penH !== '' && m.penA !== '')
    ? '<div class="ko-pen" style="font-size:13px;font-weight:700;color:#7B5800;background:#fff3cd;border-radius:6px;padding:3px 8px;margin-top:4px;">⚽ Pen ' + m.penH + '\u2013' + m.penA + '</div>' : '';

  const metaLine = 'M' + m.num + ' \u00B7 ' + formatCardDateTime(m.date, m.time);
  const venue    = m.country ? '\uD83D\uDCCD ' + m.country : '';

  return '<div class="ko-card' + (played ? ' played' : '') + '" onclick="openScoreModal(' + m.num + ')">' +
    '<div class="ko-card-meta">' + metaLine + '</div>' +
    '<div class="ko-team"><span class="' + homeNameClass + '">' + escHtml(m.home || 'TBD') + '</span>' + homeScore + '</div>' +
    '<div class="ko-team"><span class="' + awayNameClass + '">' + escHtml(m.away || 'TBD') + '</span>' + awayScore + '</div>' +
    penLine +
    (venue ? '<div class="ko-card-venue">' + venue + '</div>' : '') +
    '</div>';
}

/* ── Round section header ── */
function buildRoundHeader(label, emoji) {
  return '<div class="ko-round-header"><span class="ko-round-label">' + (emoji ? emoji + ' ' : '') + label + '</span></div>';
}

/* ── Bracket pair: two feed cards → one result card ── */
function buildPair(topCard, botCard, resultCard) {
  return '<div class="ko-pair-group">' +
    '<div class="ko-pair-cards">' + topCard + botCard + '</div>' +
    '<div class="ko-pair-connector"></div>' +
    '<div class="ko-pair-result">' + resultCard + '</div>' +
    '</div>';
}

/* ── Render full vertical bracket ── */
function renderBracket(matches, allMatches) {
  const wrap = document.getElementById('koWrap');

  if (!matches.length) {
    wrap.innerHTML = '<div class="empty-state"><div class="empty-icon">\uD83C\uDFC6</div><div class="empty-txt">No knockout matches found</div></div>';
    return;
  }

  // R32 teams are now read directly from the sheet (manually set by FIFA schedule).
  // No slot resolution needed — sheet values are authoritative.

  const mm = {};
  matches.forEach(function(m) { mm[m.num] = m; });

  let html = '<div class="ko-round-section">';

  /* ── R32 → R16  Left bracket ── */
  html += buildRoundHeader('Round of 32 \u2192 Round of 16 \u00B7 Left', '\u26A1');
  html += buildPair(buildKOCard(mm[74]), buildKOCard(mm[77]), buildKOCard(mm[89]));
  html += buildPair(buildKOCard(mm[73]), buildKOCard(mm[75]), buildKOCard(mm[90]));
  html += buildPair(buildKOCard(mm[83]), buildKOCard(mm[84]), buildKOCard(mm[93]));
  html += buildPair(buildKOCard(mm[81]), buildKOCard(mm[82]), buildKOCard(mm[94]));

  /* ── R32 → R16  Right bracket ── */
  html += buildRoundHeader('Round of 32 \u2192 Round of 16 \u00B7 Right', '\u26A1');
  html += buildPair(buildKOCard(mm[76]), buildKOCard(mm[78]), buildKOCard(mm[91]));
  html += buildPair(buildKOCard(mm[79]), buildKOCard(mm[80]), buildKOCard(mm[92]));
  html += buildPair(buildKOCard(mm[86]), buildKOCard(mm[88]), buildKOCard(mm[95]));
  html += buildPair(buildKOCard(mm[85]), buildKOCard(mm[87]), buildKOCard(mm[96]));

  /* ── R16 → QF ── */
  html += buildRoundHeader('Round of 16 \u2192 Quarter-Final', '\u26A1');
  html += buildPair(buildKOCard(mm[89]), buildKOCard(mm[90]), buildKOCard(mm[97]));
  html += buildPair(buildKOCard(mm[93]), buildKOCard(mm[94]), buildKOCard(mm[98]));
  html += buildPair(buildKOCard(mm[91]), buildKOCard(mm[92]), buildKOCard(mm[99]));
  html += buildPair(buildKOCard(mm[95]), buildKOCard(mm[96]), buildKOCard(mm[100]));

  /* ── QF → SF ── */
  html += buildRoundHeader('Quarter-Final \u2192 Semi-Final', '\u26A1');
  html += buildPair(buildKOCard(mm[97]), buildKOCard(mm[98]), buildKOCard(mm[101]));
  html += buildPair(buildKOCard(mm[99]), buildKOCard(mm[100]), buildKOCard(mm[102]));

  /* ── SF → Final ── */
  html += buildRoundHeader('Semi-Final \u2192 Final', '\uD83C\uDFC6');
  html += buildPair(buildKOCard(mm[101]), buildKOCard(mm[102]), buildKOCard(mm[104]));

  /* ── Bronze Medal ── */
  html += buildRoundHeader('Bronze Medal', '\uD83E\uDD49');
  html += '<div class="ko-single">' + buildKOCard(mm[103]) + '</div>';

  html += '</div>';
  wrap.innerHTML = html;
}
  
async function loadKnockout() {
  try {
    const allMatches = await loadAllMatches();
    window._allMatches = allMatches;
    const koMatches = allMatches.filter(m => m.isKO);

    const total     = koMatches.length;
    const played    = koMatches.filter(m => m.status === 'Played').length;
    const remaining = total - played;

    document.getElementById('totalKO').textContent     = total;
    document.getElementById('playedKO').textContent    = played;
    document.getElementById('remainingKO').textContent = remaining;

    renderBracket(koMatches);
  } catch(err) {
    console.error(err);
    document.getElementById('koWrap').innerHTML =
      '<div class="empty-state"><div class="empty-icon">&#x26A0;&#xFE0F;</div><div class="empty-txt">Failed to load knockout stage</div></div>';
    showToast('Failed to load knockout matches', 'error');
  }
}

async function syncKnockout() {
  showToast('Refreshing\u2026');
  await loadAllMatches(true);
  await loadKnockout();
  showToast('\u2705 Updated');
}

window.onload = async function() {
  document.getElementById('scoreModalMount').innerHTML = renderScoreModalHTML();
  await initPageAuth({
    activePage: 'knockout',
    onReady: async () => {
      await loadKnockout();
      showMainApp();
    }
  });
};
</script>
</body>
</html>
